<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tréninkový deník</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Trénink">
<meta name="theme-color" content="#07070c">
<link rel="apple-touch-icon" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAALQAAAC0CAIAAACyr5FlAAAAdUlEQVR42u3BMQEAAADCoPVPbQsvoAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAB4G3xzAAG1XkYyAAAAAElFTkSuQmCC">
<link rel="icon" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAALQAAAC0CAIAAACyr5FlAAAAdUlEQVR42u3BMQEAAADCoPVPbQsvoAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAB4G3xzAAG1XkYyAAAAAElFTkSuQmCC">
<style>
:root{
  /* layout: one column phone app, sticky workout header, bottom tab bar, bottom sheets */
  --bg:#07070c; --s1:#101018; --s2:#181824; --s3:#232335; --line:#2b2b40;
  --tx:#cdc9df; --dim:#7f7b98; --hot:#ff6b3d; --vio:#8f6bff; --ok:#2fd6a6; --warn:#ffb547; --bad:#ff5470;
  --disp:ui-rounded,"SF Pro Rounded",-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;
  --body:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 var(--body);-webkit-text-size-adjust:100%}
body{min-height:100vh;overscroll-behavior-y:none;
  background:radial-gradient(90% 40% at 100% 0,rgba(143,107,255,.20),transparent 70%),radial-gradient(80% 35% at 0 8%,rgba(255,107,61,.13),transparent 70%),var(--bg);background-attachment:fixed}
button,input,select,textarea{font:inherit;color:inherit}
button{border:0;background:none;padding:0;cursor:pointer;text-align:inherit}
button:focus-visible,input:focus-visible,a:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--vio);outline-offset:2px}
h1,h2,h3{font-family:var(--disp);margin:0;text-wrap:balance}
h1{font-size:30px;font-weight:800;letter-spacing:-.02em;color:#e4e0f2}
h2{font-size:20px;font-weight:700;color:#e4e0f2}
p{margin:0}
a{color:var(--vio)}
#cap{position:fixed;top:0;left:0;right:0;height:var(--st);background:var(--bg);z-index:30}
#view{max-width:560px;margin:0 auto;padding:calc(var(--st) + 18px) 16px calc(var(--sb) + 96px);display:flex;flex-direction:column;gap:14px}
.eyebrow{font:600 12px var(--disp);letter-spacing:.14em;text-transform:uppercase;color:var(--hot)}
.sub{color:var(--dim);font-size:14px}
.card{background:linear-gradient(180deg,var(--s2),var(--s1));border:1px solid var(--line);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card.glow{border-color:rgba(255,107,61,.45);box-shadow:0 0 0 1px rgba(255,107,61,.12),0 18px 40px -22px rgba(255,107,61,.6)}
.row{display:flex;align-items:center;gap:10px}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:14px;font:700 16px var(--disp);background:var(--s3);color:var(--tx);border:1px solid var(--line);text-align:center}
.btn.hot{background:linear-gradient(135deg,#ff7a45,#ff4f6d);color:#170806;border:0}
.btn.vio{background:linear-gradient(135deg,#9a7bff,#6f4bff);color:#0d0822;border:0}
.btn.ghost{background:transparent}
.btn.bad{background:rgba(255,84,112,.14);color:var(--bad);border-color:rgba(255,84,112,.4)}
.btn.sm{min-height:38px;padding:0 12px;font-size:14px;border-radius:11px}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.4}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:12px}
.stat b{display:block;font:800 24px var(--disp);color:#e4e0f2;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--dim)}
.empty{color:var(--dim);text-align:center;padding:18px 8px;font-size:15px}
.note{font-size:13px;color:var(--dim)}
.pill{display:inline-flex;align-items:center;padding:2px 9px;border-radius:99px;font:600 12px var(--disp);border:1px solid var(--line);color:var(--dim);white-space:nowrap}
.pill.ok{color:var(--ok);border-color:rgba(47,214,166,.4);background:rgba(47,214,166,.1)}
.pill.warn{color:var(--warn);border-color:rgba(255,181,71,.4);background:rgba(255,181,71,.1)}
.pill.bad{color:var(--bad);border-color:rgba(255,84,112,.4);background:rgba(255,84,112,.1)}
.pill.vio{color:#b7a2ff;border-color:rgba(143,107,255,.45);background:rgba(143,107,255,.12)}
/* tab bar */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;padding:8px 10px calc(var(--sb) + 8px);background:rgba(10,10,16,.82);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-top:1px solid var(--line)}
#tabs div{display:flex;width:100%;max-width:560px}
#tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font:600 11px var(--disp);color:var(--dim);border-radius:12px}
#tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#tabs button.on{color:var(--hot)}
/* workout */
.wh{position:sticky;top:var(--st);z-index:10;margin:-18px -16px 0;padding:12px 16px;background:rgba(10,10,16,.9);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
#timer{font:800 40px/1 var(--disp);font-variant-numeric:tabular-nums;color:#f1edff;letter-spacing:-.02em}
.bar{height:6px;border-radius:9px;background:var(--s3);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--vio),var(--hot));border-radius:9px;transition:width .3s}
.rest{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--dim);min-height:34px}
.rest b{font:800 18px var(--disp);font-variant-numeric:tabular-nums;color:var(--warn);min-width:52px}
.rest.go b{color:var(--ok)}
.rest.idle b{display:none}
.rest .btn{min-height:32px;padding:0 10px;font-size:13px}
.rest.idle .btn{display:none}
.item-h{display:flex;align-items:flex-start;gap:8px}
.item-h .nm{flex:1;font:700 17px var(--disp);color:#e4e0f2;text-align:left}
.item-h .nm small{display:block;font:500 12px var(--body);color:var(--dim)}
.ic{width:34px;height:34px;border-radius:10px;background:var(--s3);color:var(--dim);display:grid;place-items:center;font-size:16px;flex:none}
.sets{display:flex;flex-direction:column;gap:6px}
.set,.sethead{display:grid;align-items:center;gap:6px}
.set.w,.sethead.w{grid-template-columns:20px minmax(54px,1fr) 54px 60px 44px}
.set.p,.sethead.p{grid-template-columns:20px 1fr 1fr}
.sethead{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
.set .n{font:700 13px var(--disp);color:var(--dim);text-align:center}
.set .pl{font-size:13px;color:var(--dim);font-variant-numeric:tabular-nums}
.num{width:100%;height:42px;border-radius:11px;border:1px solid var(--line);background:var(--bg);text-align:center;font:700 16px var(--disp);font-variant-numeric:tabular-nums;color:#e4e0f2;padding:0 4px}
.chk{height:42px;border-radius:11px;border:1px solid var(--line);background:var(--s3);color:var(--dim);display:grid;place-items:center;font-size:18px;font-weight:800}
.set.done .chk{background:var(--ok);border-color:var(--ok);color:#04231a}
.set.done .num{border-color:rgba(47,214,166,.45);color:var(--ok)}
.warm ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:3px;font-size:15px}
.warm.done{opacity:.55}
/* inputs */
.txt{width:100%;min-height:46px;border-radius:13px;border:1px solid var(--line);background:var(--bg);padding:10px 14px;color:#e4e0f2}
textarea.txt{min-height:90px;resize:vertical}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;margin:0 -16px;padding-left:16px;padding-right:16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 13px;border-radius:99px;border:1px solid var(--line);background:var(--s1);font:600 13px var(--disp);color:var(--dim);white-space:nowrap}
.chip.on{background:rgba(143,107,255,.18);border-color:var(--vio);color:#c9bbff}
.chip.hoton.on{background:rgba(255,107,61,.16);border-color:var(--hot);color:#ffab90}
h3.cat{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin:14px 2px 6px;display:flex;justify-content:space-between}
h3.cat span{font-weight:500}
.ex{display:flex;align-items:stretch;gap:8px;margin-bottom:6px}
.ex-main{flex:1;min-width:0;background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:5px}
.ex-main b{font:600 15px var(--disp);color:#dcd8ec}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tags i{font:600 11px var(--disp);font-style:normal;padding:1px 8px;border-radius:99px;border:1px solid var(--line);color:var(--dim)}
.tags .eqS{color:#8fb8ff;border-color:rgba(143,184,255,.35)}
.tags .eqV{color:var(--ok);border-color:rgba(47,214,166,.35)}
.tags .eqN{color:#c9bbff;border-color:rgba(143,107,255,.4)}
.tags .top{color:var(--hot);border-color:rgba(255,107,61,.45)}
.ex .add{width:48px;border-radius:14px;background:linear-gradient(135deg,#9a7bff,#6f4bff);color:#0d0822;font:800 24px var(--disp);display:grid;place-items:center}
/* sheet */
#sheet{display:none}
#sheet.on{display:block;position:fixed;inset:0;z-index:40}
.sh-bg{position:absolute;inset:0;background:rgba(3,3,6,.72)}
.sh-body{position:absolute;left:0;right:0;bottom:0;max-height:calc(100% - var(--st) - 24px);overflow-y:auto;background:var(--s1);border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;padding:20px 16px calc(var(--sb) + 20px);display:flex;flex-direction:column;gap:12px;max-width:560px;margin:0 auto;-webkit-overflow-scrolling:touch}
.sh-body::before{content:"";width:40px;height:4px;border-radius:4px;background:var(--line);align-self:center;margin-top:-8px;flex:none}
.mm{display:flex;justify-content:center;gap:18px;background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:12px}
.mm figure{margin:0;text-align:center;font-size:11px;color:var(--dim)}
.mm svg{width:96px;height:192px;display:block}
.legend{display:flex;gap:14px;justify-content:center;font-size:12px;color:var(--dim)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.how{font-size:15px;line-height:1.55}
.errbox{border-left:3px solid var(--warn);padding:6px 10px;background:rgba(255,181,71,.07);border-radius:0 10px 10px 0;font-size:14px}
.errbox b{color:var(--warn)}
/* history */
.hrow{display:grid;grid-template-columns:20px 1fr 1fr auto;gap:8px;align-items:center;font-size:14px;font-variant-numeric:tabular-nums;padding:5px 0;border-top:1px solid var(--line)}
.hrow.head{border:0;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim)}
.hrow .n{color:var(--dim);text-align:center}
.month{font:700 13px var(--disp);letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin:6px 2px 0}
/* guide */
.q{display:flex;flex-direction:column;gap:8px}
.q b{font:700 16px var(--disp);color:#e4e0f2}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.g h2{margin-top:6px}
.g ul,.g ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:15px}
.g .big{font:800 22px var(--disp);color:#e4e0f2}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kv div{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.kv span{display:block;font-size:12px;color:var(--dim)}
.kv b{font:700 16px var(--disp);color:#e4e0f2}
.day{border-left:3px solid var(--vio);padding-left:12px}
.day b{font:700 15px var(--disp);color:#c9bbff}
#toast{position:fixed;left:50%;bottom:calc(var(--sb) + 92px);transform:translateX(-50%);background:#2a2440;border:1px solid var(--vio);color:#e4e0f2;padding:9px 16px;border-radius:99px;font:600 14px var(--disp);z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;max-width:88%;text-align:center}
#toast.on{opacity:1}
label.chkrow{display:flex;gap:10px;align-items:center;font-size:15px}
label.chkrow input{width:22px;height:22px;accent-color:var(--hot)}
select.txt{-webkit-appearance:none;appearance:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="cap"></div>
<main id="view"></main>
<nav id="tabs"><div id="tabsin"></div></nav>
<div id="sheet"></div>
<div id="toast" role="status"></div>
<input type="file" id="file" accept="application/json,.json,text/plain" hidden>
<script>
"use strict";
/* ---------- data: exercises ---------- */
const CATS=[['hrudnik','Hrudník',['chest']],['zada','Záda',['lats','traps']],['ramena','Ramena',['shoulders']],['biceps','Biceps',['biceps']],['triceps','Triceps',['triceps']],['predlokti','Předloktí',['forearms']],['core','Břicho a střed těla',['abs','obliques']],['hyzde','Hýždě',['glutes']],['kvadr','Přední stehna',['quads']],['hams','Zadní stehna',['hams']],['lytka','Lýtka',['calves']],['telo','Celé tělo a kondice',['quads','glutes','abs','shoulders']]];
const CATN=Object.fromEntries(CATS.map(c=>[c[0],c[1]])),CATM=Object.fromEntries(CATS.map(c=>[c[0],c[2]]));
const EQS={S:'stroj / kladka',V:'vlastní váha',N:'činky a náčiní'};
/* id|název|kategorie|vybavení|příznaky (*=nejúčinnější, t=sekundy, m=minuty)|svaly (hlavní/pomocné nebo jen pomocné)|provedení|častá chyba */
const RAW=`
h1|Bench press s velkou činkou|hrudnik|N|*|triceps,shoulders|Lehni si na lavici tak, abys měl oči pod osou. Stáhni lopatky k sobě a dolů, chodidla opři pevně o zem. Činku spouštěj pomalu na spodní část hrudníku s lokty asi 45–70° od těla a vytlač ji zpět nad ramena.|Odrážení činky od hrudníku a zvedání zadku z lavice.
h2|Tlaky s jednoručkami na rovné lavici|hrudnik|N|*|triceps,shoulders|Lehni si s jednoručkami u hrudníku, lopatky stažené. Tlač činky nahoru a mírně k sobě, dole je spusť do úrovně hrudníku, až ucítíš protažení. Zápěstí drž nad lokty.|Příliš roztažené lokty do pravého úhlu k tělu, které přetěžují ramena.
h3|Tlaky s jednoručkami na šikmé lavici|hrudnik|N|*|shoulders,triceps|Lavici nastav na 30–45°. Činky tlač od horní části hrudníku nahoru nad ramena, spouštěj kontrolovaně. Lopatky drž celou dobu stažené do lavice.|Příliš strmá lavice – cvik pak přebírají ramena.
h4|Bench press na šikmé lavici|hrudnik|N||shoulders,triceps|Na lavici se sklonem 30–45° spouštěj osu na horní část hrudníku pod klíční kosti a tlač ji kolmo vzhůru. Chodidla na zemi, lopatky stažené.|Spouštění osy příliš nízko k břichu.
h5|Rozpažování s jednoručkami|hrudnik|N||shoulders|Vleže drž činky nad hrudníkem s mírně pokrčenými lokty. Obloukem je spouštěj do stran, dokud necítíš protažení prsních svalů, a stejným obloukem vrať zpět.|Příliš těžké činky a propínání loktů.
h6|Tlaky na stroji vsedě|hrudnik|S|*|triceps,shoulders|Nastav sedačku tak, aby madla byla ve výšce středu hrudníku. Záda a lopatky opři, tlač madla dopředu do téměř propnutých loktů a pomalu vracej.|Ramena vytažená dopředu a odlepená záda od opěrky.
h7|Peck deck|hrudnik|S|*|shoulders|Sedni si s rovnými zády, lokty mírně pokrčené ve výšce ramen. Stahuj ramena stroje před tělo, v krajní poloze na vteřinu zatni hrudník a pomalu povoluj.|Švihání a příliš velký rozsah vzad, který tahá za ramena.
h8|Stahování protisměrných kladek|hrudnik|S||shoulders|Stoupni si mezi kladky, mírný předklon, jedna noha vpředu. S lehce pokrčenými lokty stahuj madla obloukem před tělo ke stehnům nebo před hrudník a pomalu vracej.|Přechod do tlaku – lokty se mají hýbat minimálně.
h9|Tlaky na šikmém stroji|hrudnik|S||shoulders,triceps|Sedni si do stroje se šikmou dráhou, madla ve výšce horní části hrudníku. Tlač nahoru a vpřed, nepropínej lokty na doraz a kontrolovaně vracej.|Krátký rozsah pohybu kvůli příliš velké zátěži.
h10|Bench press v multipressu|hrudnik|S||triceps,shoulders|Lavici umísti tak, aby osa dopadala na spodní část hrudníku. Odjisti, spusť osu k hrudníku a vytlač. Vedená dráha se hodí na učení pohybu i na dotlačení do únavy.|Špatně postavená lavice – osa míří na krk nebo břicho.
h11|Klik|hrudnik|V|*|triceps,shoulders,abs|Dlaně o něco šířeji než ramena, tělo v jedné přímce od hlavy po paty, zpevněné břicho a hýždě. Spusť hrudník těsně nad zem s lokty asi 45° od těla a vytlač se zpět.|Prohnutá bedra a hlava předsunutá dopředu.
h12|Klik na kolenou|hrudnik|V||triceps,shoulders|Stejný pohyb jako klik, jen s oporou o kolena. Tělo drž rovné od kolen po hlavu. Dobrý začátek, než zvládneš klasické kliky.|Vystrčený zadek – pohyb pak nejde z hrudníku.
h13|Klik s nohama nahoře|hrudnik|V||shoulders,triceps|Chodidla polož na lavičku nebo židli, dlaně na zem. Čím výš máš nohy, tím víc pracuje horní část hrudníku a ramena. Tělo drž zpevněné.|Propadnutí v bedrech.
h14|Široký klik|hrudnik|V||shoulders,triceps|Dlaně polož zhruba o dvě dlaně šířeji než ramena. Spouštěj se pomalu, dole ucítíš protažení hrudníku, a vytlač se zpět.|Lokty vytočené přesně do stran ve výšce ramen.
h15|Kliky na bradlech v předklonu|hrudnik|V|*|triceps,shoulders|Na bradlech se nakloň trupem dopředu, nohy pokrč vzad. Spouštěj se, dokud nejsou ramena lehce pod úrovní loktů, a vytlač se nahoru. Předklon přenáší práci na hrudník.|Příliš hluboké spuštění přes bolest v ramenou.
h16|Pullover s jednoručkou|hrudnik|N||lats,triceps|Lehni si napříč nebo podél lavice, jednoručku drž oběma rukama nad hrudníkem. S mírně pokrčenými lokty ji spouštěj obloukem za hlavu a vracej zpět nad hrudník.|Velké prohnutí v bedrech při spouštění.
h17|Tlaky s gumou ve stoje|hrudnik|N||triceps,shoulders|Gumu ukotvi za sebou ve výšce hrudníku nebo si ji dej přes záda. Tlač ruce dopředu jako při kliku a pomalu vracej. Vhodné na doma i na zahřátí.|Záklon trupu místo zpevněného středu.
z1|Shyb nadhmatem|zada|V|*|biceps,forearms|Chyť hrazdu o něco šířeji než ramena. Z visu nejdřív stáhni lopatky dolů, pak se přitáhni bradou nad hrazdu a lokty tlač k bokům. Pomalu se spusť do natažených paží.|Kopání nohama a poloviční rozsah.
z2|Shyb podhmatem|zada|V||biceps|Úchop na šířku ramen, dlaně k sobě. Přitáhni se hrudníkem k hrazdě a kontrolovaně se spusť. Oproti nadhmatu víc zapojuje biceps a bývá lehčí.|Nedotažení dolů do natažených paží.
z3|Australský shyb|zada|V|*|biceps,shoulders|Lehni si pod nízkou hrazdu, osu ve stojanu nebo TRX. Tělo zpevni do prkna, přitáhni hrudník k hrazdě a pomalu se spusť. Čím vodorovněji ležíš, tím je to těžší.|Propadlé boky a přitahování jen bradou.
z4|Stahování horní kladky k hrudníku|zada|S|*|biceps|Sedni si, stehna zajisti pod opěrky. Tyč chyť šířeji než ramena, mírně se zakloň a stahuj ji k horní části hrudníku, lokty táhni dolů a vzad. Pomalu vracej do natažení.|Stahování za hlavu a houpání trupem.
z5|Přítahy spodní kladky vsedě|zada|S|*|biceps,traps|Seď rovně s mírně pokrčenými koleny. Madlo přitáhni k břichu, lokty podél těla, na konci stáhni lopatky k sobě. Při vracení nech lopatky rozjet, ale záda drž rovná.|Velké kývání trupem dopředu a dozadu.
z6|Veslování na stroji|zada|S||biceps,traps|Hrudník opři o podložku, madla táhni k tělu a lopatky stahuj k sobě. Opora hrudníku šetří bedra, takže se můžeš soustředit jen na záda.|Krčení ramen k uším.
z7|Shyby na stroji s dopomocí|zada|S||biceps|Klekni nebo stoupni na plošinu, která tě nadlehčuje. Prováděj shyb v plném rozsahu. Postupně ubírej dopomoc, až zvládneš shyby bez ní.|Příliš velká dopomoc, při které záda skoro nepracují.
z8|Stahování kladky nataženýma rukama|zada|S||triceps|Stoupni si čelem k horní kladce, mírný předklon. S téměř nataženými pažemi stahuj tyč obloukem ke stehnům a pomalu vracej. Cítit bys to měl po stranách zad.|Ohýbání loktů – cvik pak dělá triceps.
z9|Přítahy velké činky v předklonu|zada|N|*|biceps,lowerback,traps|Předkloň se v kyčlích s rovnými zády, kolena mírně pokrčená. Osu přitahuj ke spodní části břicha, lokty veď podél těla a nahoře stáhni lopatky. Spouštěj kontrolovaně.|Kulatá záda a narovnávání trupu při každém opakování.
z10|Přítahy jednoručky v opoře o lavici|zada|N|*|biceps,traps|Jednou rukou a kolenem se opři o lavici, záda vodorovně. Jednoručku táhni loktem vzhůru k boku, nahoře krátce zatni a pomalu spusť do natažení.|Vytáčení trupu za činkou.
z11|Mrtvý tah|zada|N|*|lowerback,glutes,hams/traps,forearms,quads|Postav se s osou nad středem chodidel. Chyť ji vedle holení, zpevni břicho, narovnej záda a zvedej tlakem nohou do země, osa klouže podél nohou. Nahoře se narovnej, nezakláněj. Dolů veď boky vzad.|Kulatá bedra a osa daleko od těla.
z12|T-bar přítahy|zada|N||biceps,traps,lowerback|Postav se nad osu zapřenou v rohu nebo do T-bar stroje. V předklonu s rovnými zády přitahuj madlo k hrudníku a stahuj lopatky.|Postupné narovnávání trupu, aby šla větší váha.
z13|Krčení ramen s jednoručkami|zada|N||traps/forearms|Stůj rovně s činkami podél těla. Zvedej ramena přímo vzhůru k uším, nahoře na vteřinu zadrž a pomalu spusť. Paže zůstávají natažené.|Kroužení rameny – stačí pohyb nahoru a dolů.
z14|Hyperextenze|zada|S||lowerback/glutes,hams|Na lavici na hyperextenze se opři stehny, kotníky zajisti. S rovnými zády se předkloň a zvedni trup do roviny s nohama. Výš už nechoď.|Prudký záklon nad úroveň těla.
z15|Superman|zada|V||lowerback/glutes,shoulders|Lehni si na břicho, ruce natažené před sebe. Současně zvedni paže, hrudník a nohy kousek nad zem, dvě vteřiny vydrž a pomalu polož.|Zaklánění hlavy a švihání.
z16|Přítahy gumy vsedě|zada|N||biceps,traps|Sedni si s nataženýma nohama, gumu zahákni za chodidla. S rovnými zády přitahuj konce gumy k břichu a stahuj lopatky k sobě.|Hrbení při vracení.
r1|Tlaky s jednoručkami vsedě|ramena|N|*|triceps|Seď s oporou zad, činky ve výšce uší, lokty mírně před tělem. Tlač nahoru nad hlavu, nepropínej lokty na doraz a pomalu spouštěj zpět do výšky uší.|Prohýbání v bedrech a odlepení zad od opěrky.
r2|Tlak velké činky nad hlavu ve stoje|ramena|N|*|triceps,abs|Osu drž na horní části hrudníku, úchop těsně za šířkou ramen. Zpevni břicho a hýždě a tlač osu přímo vzhůru, hlavu lehce uhni a pak ji vrať pod osu. Kontrolovaně spusť.|Záklon v bedrech místo zpevněného trupu.
r3|Upažování s jednoručkami|ramena|N|*|traps|Stůj s činkami u stehen, lokty lehce pokrčené. Zvedej paže do stran do výšky ramen, malíčky mírně výš než palce, a pomalu spouštěj. Stačí lehká váha.|Švihání trupem a zvedání ramen k uším.
r4|Předpažování s jednoručkami|ramena|N||chest|Zvedej střídavě nebo současně natažené paže před sebe do výšky ramen a pomalu spouštěj. Trup drž v klidu.|Zaklánění a zvedání nad úroveň ramen.
r5|Zapažování v předklonu|ramena|N||traps|V hlubokém předklonu nebo vleže na šikmé lavici zvedej činky do stran s mírně pokrčenými lokty. Pohyb vede loket, cítíš zadní část ramen.|Příliš těžké činky – práci převezmou záda.
r6|Arnoldovy tlaky|ramena|N||triceps|Začni s činkami před obličejem, dlaně k sobě. Během tlaku nahoru vytáčej dlaně dopředu, nahoře jsou jako u klasického tlaku. Stejnou cestou zpět.|Rychlé tempo bez kontroly rotace.
r7|Tlaky na ramena na stroji|ramena|S|*|triceps|Sedačku nastav tak, aby madla byla ve výšce ramen. Tlač nahoru, záda opřená, a pomalu vracej. Vedená dráha je vhodná pro začátek i těžké série.|Sedačka příliš nízko – ramena začínají v nepříjemně hluboké poloze.
r8|Upažování na kladce|ramena|S||traps|Stoupni si bokem ke spodní kladce a madlo chyť vzdálenější rukou. Upažuj do výšky ramene a pomalu vracej. Kladka drží napětí v celém rozsahu.|Pomáhání trupem.
r9|Reverzní peck deck|ramena|S|*|traps|Sedni si čelem k opěrce stroje, madla před sebou. S lehce pokrčenými lokty rozpažuj dozadu, až jsou paže v rovině s rameny, a pomalu vracej. Cílíš na zadní část ramen.|Stahování lopatek místo pohybu v ramenou.
r10|Face pull na kladce|ramena|S||traps|Lano na horní kladce chyť nadhmatem. Táhni ho k obličeji, lokty vysoko a do stran, na konci vytoč ruce vzad. Výborný cvik pro zdravá ramena a držení těla.|Příliš velká váha a přitahování k hrudníku.
r11|Klik ve stříšce|ramena|V|*|triceps|Z pozice kliku zvedni boky vysoko, tělo tvoří obrácené V. Pokrč lokty a spusť hlavu mezi dlaně k zemi, pak se vytlač zpět. Nohy na lavičce cvik ztíží.|Lokty daleko do stran a pohyb vpřed místo dolů.
r12|Klik ve stojce u zdi|ramena|V||triceps,traps|Vyšvihni se do stojky zády nebo čelem ke zdi. Spouštěj hlavu pomalu k zemi a vytlač se. Náročný cvik, začni částečným rozsahem.|Prohnutá bedra a nekontrolované spouštění.
r13|Upažování s gumou|ramena|N||traps|Stoupni si na střed gumy, konce drž v rukou. Upažuj do výšky ramen a pomalu vracej. Odpor roste směrem nahoru.|Krčení ramen k uším.
b1|Bicepsový zdvih s velkou činkou|biceps|N|*|forearms|Stůj rovně, osu nebo EZ činku drž podhmatem na šířku ramen. Lokty drž u těla a zvedej činku obloukem k ramenům. Nahoře zatni a pomalu spouštěj do natažení.|Houpání trupem a lokty cestující dopředu.
b2|Bicepsový zdvih s jednoručkami|biceps|N|*|forearms|Stůj nebo seď, činky podél těla. Střídavě nebo současně zvedej činky k ramenům a během pohybu vytáčej malíček vzhůru. Spouštěj pomalu.|Švih a nedotažení dolů.
b3|Kladivový zdvih|biceps|N||forearms|Činky drž palci nahoru jako kladivo. Zvedej k ramenům bez vytáčení zápěstí. Posiluje i sval pod bicepsem a předloktí.|Lokty odlepené od těla.
b4|Bicepsový zdvih na šikmé lavici|biceps|N||forearms|Sedni si na lavici nakloněnou asi 60°, paže nech viset za tělem. Zvedej činky bez pohybu loktů vpřed. Biceps pracuje z velkého protažení.|Předsouvání ramen a loktů.
b5|Koncentrovaný zdvih|biceps|N|||Vsedě se opři loktem o vnitřní stranu stehna. Zvedej jednoručku k rameni a nahoře krátce zatni. Pomalu spusť do natažení.|Pomáhání ramenem a trupem.
b6|Bicepsový zdvih na spodní kladce|biceps|S|*|forearms|Stoupni si čelem ke spodní kladce, tyč chyť podhmatem. Lokty u těla, zvedej k ramenům a pomalu vracej. Kladka drží biceps pod napětím i dole.|Zaklánění trupu.
b7|Bicepsový zdvih na Scottově lavici|biceps|S||forearms|Paže opři o šikmou podložku, podpaží až k její hraně. Zvedej činku nebo madla stroje, dole nepropínej lokty prudce na doraz.|Zvedání loktů z podložky.
b8|Úzký shyb podhmatem|biceps|V|*|lats|Hrazdu chyť podhmatem o něco úžeji než ramena. Přitáhni se hrudníkem k hrazdě a soustřeď se na ohyb v loktech. Pomalu se spusť.|Zkrácený rozsah dole.
b9|Bicepsový přítah pod hrazdou|biceps|V||lats|Pod nízkou hrazdou nebo na TRX se chyť podhmatem. Tělo drž zpevněné a přitahuj čelo k rukám ohybem v loktech, lokty zůstávají vysoko.|Propadlé boky.
b10|Bicepsový zdvih s gumou|biceps|N||forearms|Stoupni si na gumu, konce drž podhmatem. Zvedej ruce k ramenům s lokty u těla a pomalu vracej.|Příliš rychlé spouštění.
t1|Stahování horní kladky na triceps|triceps|S|*||Stoupni si ke kladce, lano nebo tyč chyť ve výšce hrudníku. Lokty přitiskni k tělu a propínej paže dolů, dole zatni triceps. Vracej jen po úroveň hrudníku.|Lokty utíkající dopředu a naléhání váhou těla.
t2|Tricepsová extenze na kladce nad hlavou|triceps|S|||Postav se zády ke kladce, lano drž za hlavou, lokty míří vpřed. Propínej paže dopředu a nahoru a pomalu vracej do protažení.|Rozjíždění loktů do stran.
t3|Tricepsové tlaky na stroji|triceps|S||chest,shoulders|Na stroji na dipy seď vzpřímeně, madla tlač dolů do propnutí paží a pomalu vracej. Lokty drž u těla.|Zvedání ramen k uším.
t4|Kliky na bradlech vzpřímeně|triceps|V|*|chest,shoulders|Na bradlech drž trup co nejvíc svisle, lokty u těla. Spusť se, dokud nejsou paže zhruba v pravém úhlu, a vytlač se do propnutí.|Příliš hluboké spuštění a ramena u uší.
t5|Úzký klik|triceps|V|*|chest,shoulders|Dlaně polož pod hrudník blízko k sobě. Lokty veď těsně podél těla, spusť hrudník k rukám a vytlač se.|Lokty vybočující do stran.
t6|Kliky na lavičce za zády|triceps|V||shoulders|Opři dlaně o hranu lavičky za sebou, nohy před sebou. Spouštěj se ohybem loktů do pravého úhlu a vytlač se nahoru. Záda veď těsně u lavičky.|Příliš hluboké spuštění a tělo daleko od lavičky.
t7|Francouzský tlak vleže|triceps|N|*||Vleže drž EZ činku nad hrudníkem. Ohýbej jen lokty a spouštěj činku k čelu nebo těsně za hlavu, pak propni paže. Nadloktí zůstávají v klidu.|Pohyb v ramenou a rozjíždění loktů.
t8|Tricepsová extenze s jednoručkou nad hlavou|triceps|N|||Vsedě nebo ve stoje drž jednoručku oběma rukama nad hlavou. Spouštěj ji za hlavu ohybem loktů a propínej zpět. Lokty míří ke stropu.|Prohnutá bedra.
t9|Bench press úzkým úchopem|triceps|N|*|chest,shoulders|Osu chyť na šířku ramen. Spouštěj ji na spodní část hrudníku s lokty u těla a vytlač nahoru. Unese velkou zátěž pro triceps.|Příliš úzký úchop, který bolí v zápěstí.
t10|Kickback s jednoručkou|triceps|N|||V předklonu s oporou drž nadloktí vodorovně u těla. Propínej paži vzad do roviny a krátce zatni, pomalu vracej.|Švihání celou paží.
t11|Tricepsová extenze s gumou|triceps|N|||Gumu ukotvi nahoře nebo ji přišlápni a veď za hlavou. Propínej paže proti odporu a pomalu vracej, lokty drž na místě.|Pohyb loktů místo předloktí.

p3|Farmářská chůze|predlokti|N|*t|traps,abs|Vezmi do každé ruky těžkou jednoručku nebo kettlebell. Jdi vzpřímeně krátkými kroky, ramena dole a vzadu, břicho zpevněné. Počítej čas nebo vzdálenost.|Naklánění do stran a hrbení.

p5|Reverzní bicepsový zdvih|predlokti|N||biceps|Osu nebo jednoručky drž nadhmatem. Zvedej k ramenům s lokty u těla a pomalu spouštěj. Posiluje horní stranu předloktí.|Ohýbání zápěstí dolů.

p7|Zdvih zápěstí na spodní kladce|predlokti|S|*||Sedni si ke spodní kladce, předloktí opři o stehna a tyč drž podhmatem. Ohýbej zápěstí vzhůru a pomalu povoluj. Kladka dává plynulý odpor.|Pomáhání lokty.

c1|Plank|core|V|*t|shoulders,glutes|Opři se o předloktí a špičky, lokty pod rameny. Tělo drž v přímce, zatni břicho i hýždě a klidně dýchej. Ukonči, jakmile se začnou propadat bedra.|Propadlá bedra nebo zadek vysoko.
c2|Boční plank|core|V|t|obliques/abs,shoulders|Opři se o jedno předloktí a hranu chodidla, tělo v přímce. Boky tlač vzhůru a vydrž. Počítej čas na každou stranu.|Klesání boků k zemi.
c3|Zkracovačky|core|V|||Lehni si na záda, kolena pokrčená. Odlep lopatky od země postupným rolováním páteře, bedra zůstávají na zemi. Nahoře vydechni a pomalu se vrať.|Tahání hlavy rukama.
c4|Zvedání nohou ve visu|core|V|*|forearms|Zavěs se na hrazdu. Bez houpání zvedej pokrčená kolena k hrudníku, pokročilí natažené nohy do vodorovné polohy. Na konci podsaď pánev a pomalu spouštěj.|Houpání a švih z nohou.
c5|Zvedání nohou vleže|core|V|||Lehni si na záda, ruce podél těla. Zvedej natažené nohy do svislé polohy a pomalu je spouštěj těsně nad zem. Bedra drž přitisknutá k podložce.|Prohnutí beder při spouštění.
c6|Ruské twisty|core|V||obliques/abs|Seď v mírném záklonu s pokrčenými koleny. Otáčej trupem ze strany na stranu a dotýkej se rukama země vedle boků. Můžeš přidat kotouč nebo medicinbal.|Otáčení jen rukama bez rotace trupu.
c7|Horolezec|core|V||shoulders,quads|Z pozice kliku střídavě přitahuj kolena k hrudníku. Boky drž nízko a ramena nad zápěstími. Počítej opakování na obě nohy dohromady.|Zadek vysoko a poskakování.
c8|Mrtvý brouk|core|V|||Lehni si na záda, ruce ke stropu, kolena v pravém úhlu. Pomalu spouštěj protilehlou ruku a nohu k zemi, bedra tlač do podložky, a vystřídej strany.|Prohýbání beder.
c9|Bicykl|core|V||obliques,abs/|Vleže na zádech střídavě přitahuj loket k protilehlému kolenu, druhou nohu natahuj nízko nad zem. Otáčej hrudníkem, ne jen lokty.|Rychlé tempo a tahání za krk.
c10|Hollow hold|core|V|t||Lehni si na záda, bedra přitiskni k zemi. Zvedni lopatky a natažené nohy kousek nad zem, ruce za hlavu, a drž tvar misky.|Odlepená bedra – raději pokrč kolena.
c11|Sklapovačky|core|V|||Vleže natažený současně zvedni trup i nohy a dotkni se rukama holení nebo špiček. Pomalu se vrať těsně nad zem.|Švih a dopadání na záda.
c12|Zkracovačky na kladce vkleče|core|S|*||Klekni čelem k horní kladce, lano drž u hlavy. Zakulacuj páteř a táhni lokty ke kolenům, boky zůstávají na místě. Pomalu vracej.|Pohyb v kyčlích místo rolování trupu.
c13|Zkracovačky na stroji|core|S|||Sedni si do stroje, chyť madla a zakulacuj trup proti odporu. Vydechni v krajní poloze a pomalu vracej.|Tahání rukama.

function head(eb,t,sub){return `<header><div class="eyebrow">${eb}</div><h1>${t}</h1>${sub?`<p class="sub">${sub}</p>`:''}</header>`}

function vWork(){const a=S.active,[d,t]=count(a),w=WARM[a.warm]||WARM[0];

function shEx(id){const e=ex(id),lp=lastPerf(id);let best=0;S.history.forEach(h=>h.items.forEach(i=>{if(i.ex===id)i.sets.forEach(s=>{if(s.done&&+s.w>best)best=+s.w})}));

function vHist(){let o=head('Historie',S.history.length?S.history.length+' tréninků':'Historie','U každého tréninku vidíš, co bylo v plánu a co jsi opravdu odcvičil.');

function setStatus(s){if(!s.done)return['bad','vynecháno'];if(s.pr==null)return['vio','navíc'];const a=(+s.r||0)*(Math.max(+s.w,0)||1),b=(+s.pr||0)*(Math.max(+s.pw,0)||1);if(+s.r===+s.pr&&+s.w===+s.pw)return['ok','podle plánu'];if(+s.r>=+s.pr&&+s.w>=+s.pw)return['ok','nad plán'];if(a>=b)return['ok','splněno jinak'];return['warn','pod plán']}
function vHistDetail(){const h=S.history.find(x=>x.id===ui.histId),[d,t]=count(h);let pl=0,ok=0;h.items.forEach(i=>i.sets.forEach(s=>{if(s.pr!=null){pl++;if(s.done&&setStatus(s)[0]==='ok')ok++}}));

const GQ=[['goal','Čeho chceš dosáhnout?',[['hubnuti','Zhubnout'],['svaly','Nabrat svaly'],['sila','Být silnější'],['kondice','Kondice a zdraví']]],

function vGuide(){if(S.guide&&!ui.gq)return guideOut(S.guide);
  const a=ui.gq||(ui.gq={lim:[]});const ready=GQ.slice(0,5).every(q=>a[q[0]]);
  return head('Návod','Jak si sestavit plán','Odpověz na šest otázek. Dostaneš návod na míru, podle kterého si plán poskládáš sám.')+GQ.map((q,i)=>`<div class="card q"><span class="eyebrow">Otázka ${i+1} z ${GQ.length}</span><b>${q[1]}</b><div class="opts">${q[2].map(o=>`<button class="chip ${(q[0]==='lim'?a.lim.includes(o[0]):a[q[0]]===o[0])?'on':''}" data-a="gq" data-k="${q[0]}" data-v="${o[0]}">${o[1]}</button>`).join('')}</div></div>`).join('')+`<button class="btn hot" data-a="gqGo" ${ready?'':'disabled'}>Sestavit návod</button>${S.guide?'<button class="btn ghost" data-a="gqCancel">Zpět k mému návodu</button>':''}`}
function guideOut(a){
  const days=+a.days,time=+a.time,zac=a.lvl==='zac';
  const G={hubnuti:['Hubnutí','8–15','60–90 s'],svaly:['Nabírání svalů','6–12, u izolovaných cviků 10–15','1,5–2,5 min'],sila:['Síla','3–6 u hlavních cviků, 6–10 u doplňkových','3–5 min u hlavních cviků, 2 min u ostatních'],kondice:['Kondice a zdraví','10–15','45–75 s']}[a.goal];
  const nEx={30:[3,4],45:[4,5],60:[5,6],90:[6,8]}[time];
  const setsPer=zac?'2–3':'3–4';
  const wk=a.goal==='sila'?(zac?'5–8':'8–12'):zac?'6–10':a.lvl==='pok'?'10–14':'12–20';
  const FULL=['Dřepový pohyb na přední stehna','Tlak na hrudník','Tah na záda','Ohyb v kyčli na zadní stehna a hýždě','Ramena','Střed těla','Paže: biceps nebo triceps','Lýtka'];
  const UP=['Tlak na hrudník','Přítahy na záda vodorovně','Tlak na ramena','Tah na záda shora: shyby nebo stahování kladky','Biceps','Triceps','Zadní ramena nebo upažování','Předloktí'];
  const LOW=['Dřepový pohyb','Ohyb v kyčli: rumunský tah nebo hip thrust','Jednonožný cvik: výpady nebo bulharský dřep','Zadní stehna izolovaně','Lýtka','Střed těla','Hýždě izolovaně','Střed těla s rotací'];
  const PUSH=['Tlak na hrudník','Tlak na ramena','Hrudník z jiného úhlu','Upažování','Triceps','Triceps podruhé','Střed těla','Lýtka'];
  const PULL=['Tah na záda shora','Přítahy na záda vodorovně','Zadní ramena','Biceps','Biceps kladivovým úchopem','Předloktí','Spodní záda','Střed těla'];
  let split,daysL,note='';
  if(days<=3){split='Celé tělo na každém tréninku';daysL=days===2?[['Trénink A',FULL],['Trénink B',FULL]]:[['Trénink A',FULL],['Trénink B',FULL],['Trénink A nebo C',FULL]];note='V tréninku B vyber na stejné pozice jiné cviky než v A. Mezi tréninky si nech aspoň jeden den volna.'}
  else if(days===4||zac){split='Horní a dolní polovina těla';daysL=[['Horní A',UP],['Dolní A',LOW],['Horní B',UP],['Dolní B',LOW]];note=(days===5&&zac?'Jako začátečník z pěti tréninků týdně nevytěžíš víc než ze čtyř dobře odvedených. Pátý den věnuj chůzi, kolu nebo plavání. ':'')+'Dva dny po sobě, den volna, dva dny po sobě. Ve variantě B vyměň aspoň polovinu cviků.'}
  else{split='Tlaky, tahy, nohy a k tomu horní a dolní den';daysL=[['Tlaky',PUSH],['Tahy',PULL],['Nohy',LOW],['Horní',UP],['Dolní',LOW]];note='Každou svalovou skupinu tak procvičíš dvakrát týdně. Po třech dnech si dej den volna.'}
  const eqTxt={gym:'V knihovně cviků si zapni filtr <b>stroj / kladka</b> nebo <b>činky a náčiní</b>. Základ postav na volných vahách nebo strojích s velkou zátěží, izolované cviky doplň na kladkách.',doma_n:'V knihovně cviků si zapni filtr <b>činky a náčiní</b> a doplň ho cviky s <b>vlastní vahou</b>. S jednoručkami a gumou procvičíš celé tělo, jen místo přidávání kil budeš časem přidávat opakování.',doma_v:'V knihovně cviků si zapni filtr <b>vlastní váha</b>. Zátěž nezvyšuješ kotouči, ale těžší variantou: nohy výš, cvik na jedné noze nebo ruce, pomalejší spouštění na 3–4 vteřiny, pauza v dolní poloze.'}[a.place];
  const goalTxt={
   hubnuti:['O hubnutí rozhoduje jídlo: potřebuješ sníst zhruba o 300–500 kcal denně méně, než vydáš. Trénink se zátěží je tu od toho, abys při hubnutí neztrácel svaly.','Cvič stejně poctivě jako někdo, kdo nabírá. Lehké váhy a desítky opakování tuk nespálí lépe.','Jez 1,6–2,2 g bílkovin na kilogram váhy denně.','Přidej pohyb mimo trénink: 8–10 tisíc kroků denně a jednou až dvakrát týdně 20–30 minut kardia z kategorie Celé tělo a kondice.','Rozumné tempo je půl až jedno procento tělesné váhy týdně. Rychlejší úbytek bere i svaly.'],
   svaly:['Svaly rostou, když je opakovaně zatížíš blízko jejich hranice a pak jim dáš jídlo a spánek.','Jez mírně nad svou spotřebu, asi o 200–300 kcal denně, a 1,6–2,2 g bílkovin na kilogram váhy.','Každou sérii ukonči ve chvíli, kdy bys zvládl už jen jedno až tři další opakování.','Spi 7–9 hodin. Bez spánku se objem tréninku neprojeví.','Kardio nevynechávej úplně, dvě kratší klidné jednotky týdně růstu neublíží.'],
   sila:['Síla je dovednost: méně cviků, těžší váhy, čistá technika a dlouhé pauzy.','Každý trénink začni jedním až dvěma hlavními cviky: dřep, mrtvý tah, bench press, tlak nad hlavu, shyby nebo přítahy.','U hlavních cviků si nech jedno až dvě opakování v rezervě. Do selhání nechoď.','Doplňkové cviky ber jako stavbu svalů, které hlavním cvikům pomáhají.','Jez aspoň tolik, kolik vydáš. V deficitu síla roste pomalu.'],
   kondice:['Cílem je cítit se dobře a vydržet. Spoj posilování celého těla s pohybem, který zvedne tep.','Dospělým se doporučuje aspoň 150 minut středně náročného pohybu týdně a k tomu dvakrát týdně posilování. Tvůj plán pokryje obojí.','Cviky můžeš řadit do dvojic nebo do kruhu a zkrátit tak pauzy.','Na konec tréninku zařaď 5–10 minut z kategorie Celé tělo a kondice.','Pravidelnost má větší cenu než náročnost. Raději kratší trénink, který nevynecháš.']}[a.goal];
  const lim=[];
  if(a.lim.includes('zada'))lim.push('<b>Záda:</b> začni cviky s oporou trupu, jako je veslování na stroji, leg press nebo tlaky vsedě. Těžké předklony s osou přidej až po zvládnutí techniky s lehkou vahou. Do každého tréninku dej plank nebo mrtvého brouka.');
  if(a.lim.includes('kolena'))lim.push('<b>Kolena:</b> dřepuj jen do hloubky bez bolesti a drž kolena ve směru špiček. Dobře se snáší leg press, most, hip thrust, výpady vzad a zakopávání. Výskoky a angličáky zatím vynech.');
  if(a.lim.includes('ramena'))lim.push('<b>Ramena:</b> tlač raději s jednoručkami a s lokty mírně před tělem, nespouštěj nic za hlavu. Na každý tlakový cvik zařaď jeden tahový a přidej face pull nebo reverzní peck deck.');
  let o=head('Návod na míru',G[0],'Sestaveno z tvých odpovědí. Plán si podle něj poskládáš sám v záložce Plány.')+'<div class="g" style="display:flex;flex-direction:column;gap:14px">';
  o+=`<div class="card glow"><span class="eyebrow">Rozdělení týdne</span><p class="big">${split}</p><p class="sub">${days>=5?'5':days} tréninků týdně po ${time} minutách</p><p>${note}</p></div>`;
  o+=`<div class="kv"><div><span>Cviků na trénink</span><b>${nEx[0]}–${nEx[1]}</b></div><div><span>Sérií na cvik</span><b>${setsPer}</b></div><div><span>Opakování</span><b>${G[1]}</b></div><div><span>Pauza mezi sériemi</span><b>${G[2]}</b></div><div style="grid-column:1/-1"><span>Sérií na svalovou skupinu za týden</span><b>${wk}</b></div></div>`;
  o+=`<div class="card"><h2>Kostra tréninků</h2><p class="sub">Na každou pozici vyber jeden cvik. Těžké cviky na víc kloubů patří na začátek, izolované na konec.</p>${daysL.map(d=>`<div class="day"><b>${d[0]}</b><ol>${d[1].slice(0,nEx[1]).map(x=>`<li>${x}</li>`).join('')}</ol></div>`).join('')}${time===30?'<p class="note">Na 30 minut spoj cviky do dvojic, které si nepřekážejí, třeba tlak a tah, a střídej je bez pauzy.</p>':''}</div>`;
  o+=`<div class="card"><h2>Co rozhoduje u tvého cíle</h2><ul>${goalTxt.map(x=>`<li>${x}</li>`).join('')}</ul></div>`;
  o+=`<div class="card"><h2>Jak vybírat cviky</h2><p>${eqTxt}</p><p>Začni s filtrem <b>Nejúčinnější</b>. V každé kategorii najdeš osvědčené cviky pro stroje, vlastní váhu i náčiní.</p><button class="btn sm vio" data-a="goTop">Zobrazit nejúčinnější cviky</button></div>`;
  o+=`<div class="card"><h2>Jak přidávat</h2><ul><li>Zvol váhu, se kterou splníš spodní hranici opakování s jedním až třemi opakováními v rezervě.</li><li>Každý trénink se snaž přidat opakování. Jakmile ve všech sériích dosáhneš horní hranice, zvyš váhu o nejmenší možný krok, asi 2,5–5 %, a začni znovu od spodní hranice.</li><li>${zac?'První dva až tři týdny ber lehčí váhy a hlídej techniku. Popis najdeš u každého cviku.':'Když se čtyři týdny nikam neposuneš, vyměň cvik za podobný nebo týden uber třetinu sérií.'}</li><li>Po 6–8 týdnech plán projdi a uprav. V historii uvidíš, kde jsi plnil plán a kde ne.</li></ul></div>`;
  if(lim.length)o+=`<div class="card"><h2>Na co si dát pozor</h2><ul>${lim.map(x=>`<li>${x}</li>`).join('')}</ul><p class="note">Ostrá nebo přetrvávající bolest patří k lékaři nebo fyzioterapeutovi, ne do tréninku.</p></div>`;
  o+=`<div class="card"><h2>Postup v deníku</h2><ol><li>V záložce Plány založ pro každý tréninkový den jeden plán a pojmenuj ho podle kostry výše.</li><li>Přes Přidat cvik vyber na každou pozici jeden cvik.</li><li>U každého cviku nastav počet sérií a opakování podle tabulky. Váhu zatím odhadni.</li><li>Na prvním tréninku přepiš váhy podle skutečnosti a při dokončení nech plán přepsat odcvičenými hodnotami.</li></ol><button class="btn hot" data-a="newPlan">Založit první plán</button></div>`;
  return o+`</div><button class="btn ghost" data-a="gqRedo">Vyplnit dotazník znovu</button>`}
/* ---------- backup ---------- */
function shBackup(){return `<div class="row"><h2 class="grow">Záloha dat</h2><button class="btn sm" data-a="closeSheet">Zavřít</button></div><p class="sub">Plány i historie jsou uložené jen v tomto zařízení, a to dvakrát vedle sebe. Občas si ulož zálohu do Souborů nebo iCloudu pro případ ztráty telefonu nebo smazání dat webu.</p><button class="btn vio" data-a="export">Uložit zálohu do souboru</button><button class="btn" data-a="copyData">Zkopírovat zálohu jako text</button><button class="btn" data-a="importFile">Obnovit ze souboru</button><label class="q"><span class="eyebrow">Obnovit z textu</span><textarea class="txt" id="paste" placeholder="Sem vlož text zálohy"></textarea></label><button class="btn" data-a="importPaste">Obnovit z vloženého textu</button><button class="btn bad" data-a="wipe">Smazat všechna data</button>`}
function doImport(txt){let o;try{o=JSON.parse(txt)}catch(e){return toast('Tohle není platná záloha.')}
  if(!o||!Array.isArray(o.plans)||!Array.isArray(o.history))return toast('Tohle není platná záloha.');
  ask('Nahradit současná data zálohou? ('+o.plans.length+' plánů, '+o.history.length+' tréninků)','Nahradit',()=>{adopt(o);save();sheets.length=0;renderSheet();ui.tab='dnes';render();toast('Data obnovena.')})}
function shNewEx(){return `<h2>Vlastní cvik</h2><input class="txt" id="nx-name" placeholder="Název cviku" aria-label="Název cviku"><select class="txt" id="nx-cat" aria-label="Svalová skupina">${CATS.map(c=>`<option value="${c[0]}">${c[1]}</option>`).join('')}</select><select class="txt" id="nx-eq" aria-label="Vybavení">${Object.keys(EQS).map(k=>`<option value="${k}">${EQS[k]}</option>`).join('')}</select><select class="txt" id="nx-u" aria-label="Jednotka"><option value="">Počítám opakování</option><option value="t">Počítám sekundy</option><option value="m">Počítám minuty</option></select><textarea class="txt" id="nx-how" placeholder="Poznámka k provedení (nepovinné)"></textarea><button class="btn vio" data-a="saveEx">Uložit cvik</button><button class="btn ghost" data-a="closeSheet">Zpět</button>`}
/* ---------- actions ---------- */
const A={
 tab(d){ui.tab=d.t;if(d.t==='plany')ui.planId=null;if(d.t==='historie')ui.histId=null;ui.gq=null;render();window.scrollTo(0,0)},
 closeSheet(){closeSheet()},
 askOk(){const c=askCb;askCb=null;sheets.pop();renderSheet();if(c)c();render()},
 start(d){const go=()=>{const p=S.plans.find(x=>x.id===d.id);
   S.active={id:uid(),planId:p?p.id:null,name:p?(p.name||'Plán bez názvu'):'Volný trénink',start:Date.now(),warm:pickWarm(),warmDone:false,restEnd:0,items:p?p.items.map(it=>({ex:it.ex,sets:it.sets.map(s=>({pr:s.r,pw:s.w,r:s.r,w:s.w,done:false}))})):[]};
   save();ui.tab='dnes';render();window.scrollTo(0,0);wake()};
   if(S.active)ask('Už jeden trénink běží. Zahodit ho a začít nový?','Začít nový',go);else go()},
 warmDone(){S.active.warmDone=!S.active.warmDone;save();render()},
 warmNext(){S.active.warm=pickWarm();save();render()},
 done(d){const s=S.active.items[+d.i].sets[+d.s];s.done=!s.done;S.active.restEnd=s.done?Date.now()+S.rest*1000:0;save();render()},
 rest(d){const a=S.active,n=+d.d;if(!n){a.restEnd=0}else{S.rest=Math.max(15,S.rest+n);if(a.restEnd>Date.now())a.restEnd=Math.max(Date.now(),a.restEnd+n*1000)}save();render()},
 addSet(d){const it=ctxItems()[+d.i],l=it.sets[it.sets.length-1]||{r:10,w:0};it.sets.push(ui.tab==='plany'?{r:l.r,w:l.w}:{pr:null,pw:null,r:l.r,w:l.w,done:false});save();render()},
 delSet(d){const it=ctxItems()[+d.i];if(it.sets.length>1){it.sets.pop();save();render()}},
 delItem(d){const l=ctxItems();ask('Odebrat cvik '+ex(l[+d.i].ex).name+'?','Odebrat',()=>{l.splice(+d.i,1);save()})},
 mv(d){const l=ctxItems(),i=+d.i,j=i+ +d.d;if(j<0||j>=l.length)return;[l[i],l[j]]=[l[j],l[i]];save();render()},
 pick(d){ui.pick={kind:d.k};openSheet(shPick)},
 pickAdd(d){const sets=defSets(d.id);if(ui.pick.kind==='plan'){const p=curPlan();if(!p)return;p.items.push({ex:d.id,sets})}else S.active.items.push({ex:d.id,sets:sets.map(s=>({pr:null,pw:null,r:s.r,w:s.w,done:false}))});save();toast('Přidáno: '+ex(d.id).name);if(sheets.length>1){sheets.pop();renderSheet()}},
 exDetail(d){const id=d.id;openSheet(()=>shEx(id))},
 fTop(){ui.lib.top=!ui.lib.top;refresh()},
 fEq(d){ui.lib.eq=ui.lib.eq===d.v?'':d.v;refresh()},
 fCat(d){ui.lib.cat=d.v;refresh()},
 finish(){openSheet(()=>{const a=S.active,[d,t]=count(a),p=S.plans.find(x=>x.id===a.planId);return `<h2>Dokončit trénink?</h2><p>Čas ${fDur(Date.now()-a.start)}, odškrtnuto ${d} z ${t} sérií.</p>${t-d?'<p class="note">Neodškrtnuté série se uloží jako vynechané.</p>':''}${p&&d?'<label class="chkrow"><input type="checkbox" id="upd"> Přepsat plán tím, co jsem dnes odcvičil</label>':''}<button class="btn hot" data-a="finishGo">Uložit do historie</button><button class="btn ghost" data-a="closeSheet">Ještě cvičím</button>`})},
 finishGo(){const a=S.active,u=$('#upd'),p=S.plans.find(x=>x.id===a.planId);
   if(u&&u.checked&&p)p.items=a.items.map(it=>({ex:it.ex,sets:it.sets.filter(s=>s.done).map(s=>({r:s.r,w:s.w}))})).filter(it=>it.sets.length);
   const h={id:a.id,planId:a.planId,name:a.name,start:a.start,end:Date.now(),warm:a.warmDone?(WARM[a.warm]||WARM[0])[0]:'',items:a.items};
   S.history.unshift(h);S.active=null;save();unwake();sheets.length=0;renderSheet();ui.tab='historie';ui.histId=h.id;render();window.scrollTo(0,0);toast('Trénink uložen.')},
 cancelWork(){ask('Zrušit trénink? Nic z něj se neuloží.','Zrušit trénink',()=>{S.active=null;save();unwake()})},
 newPlan(){const p={id:uid(),name:'',items:[]};S.plans.push(p);save();ui.tab='plany';ui.planId=p.id;render();window.scrollTo(0,0)},
 editPlan(d){ui.planId=d.id;render();window.scrollTo(0,0)},
 dupPlan(d){const p=S.plans.find(x=>x.id===d.id),c=JSON.parse(JSON.stringify(p));c.id=uid();c.name=(p.name||'Plán')+' – kopie';S.plans.push(c);save();render()},
 delPlan(){ask('Smazat tento plán? Historie tréninků zůstane.','Smazat plán',()=>{S.plans=S.plans.filter(p=>p.id!==ui.planId);ui.planId=null;save()})},
 backPlans(){ui.planId=null;render()},
 hist(d){ui.histId=d.id;render();window.scrollTo(0,0)},
 backHist(){ui.histId=null;render()},
 delHist(){ask('Smazat tento záznam z historie?','Smazat',()=>{S.history=S.history.filter(h=>h.id!==ui.histId);ui.histId=null;save()})},
 gq(d){const a=ui.gq;if(d.k==='lim'){const i=a.lim.indexOf(d.v);i<0?a.lim.push(d.v):a.lim.splice(i,1)}else a[d.k]=d.v;render()},
 gqGo(){S.guide=ui.gq;ui.gq=null;save();render();window.scrollTo(0,0)},
 gqRedo(){ui.gq=JSON.parse(JSON.stringify(S.guide));render();window.scrollTo(0,0)},
 gqCancel(){ui.gq=null;render()},
 goTop(){ui.lib={q:'',cat:'',eq:'',top:true};ui.tab='cviky';render();window.scrollTo(0,0)},
 newEx(){openSheet(shNewEx)},
 saveEx(){const n=$('#nx-name').value.trim();if(!n)return toast('Napiš název cviku.');S.custom.push({id:'u'+uid(),name:n,cat:$('#nx-cat').value,eq:$('#nx-eq').value,fl:$('#nx-u').value,mus:'',how:$('#nx-how').value.trim(),err:''});save();closeSheet();toast('Cvik uložen.')},
 delEx(d){ask('Smazat vlastní cvik? V plánech a historii zůstane jako smazaný.','Smazat',()=>{S.custom=S.custom.filter(c=>c.id!==d.id);sheets.length=0;save()})},
 backup(){openSheet(shBackup)},
 async export(){const j=JSON.stringify(S),n='trenink-zaloha-'+new Date().toISOString().slice(0,10)+'.json';S.lastBackup=Date.now();save();
   try{const f=new File([j],n,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return}}catch(e){if(e&&e.name==='AbortError')return}
   try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([j],{type:'application/json'}));a.download=n;document.body.appendChild(a);a.click();a.remove();toast('Záloha uložena.')}catch(e){toast('Uložení se nepovedlo, zkus zkopírovat text.')}},
 async copyData(){try{await navigator.clipboard.writeText(JSON.stringify(S));S.lastBackup=Date.now();save();toast('Zkopírováno. Vlož si text do Poznámek.')}catch(e){toast('Kopírování se nepovedlo.')}},
 importFile(){$('#file').click()},
 importPaste(){doImport($('#paste').value)},
 wipe(){ask('Opravdu smazat všechny plány a celou historii? Nejde to vrátit.','Smazat vše',()=>{S=DEF();save();sheets.length=0;ui.tab='dnes'})}
};
function refresh(){render();renderSheet()}
/* wake lock keeps the screen on during a workout where supported */
let wl=null;
async function wake(){try{if(S.active&&navigator.wakeLock&&document.visibilityState==='visible')wl=await navigator.wakeLock.request('screen')}catch(e){}}
function unwake(){try{if(wl)wl.release()}catch(e){}wl=null}
function tick(){const a=S.active;if(!a)return;const t=$('#timer');if(t)t.textContent=fDur(Date.now()-a.start);const r=$('#rest');if(r&&a.restEnd){const b=r.querySelector('b'),l=a.restEnd-Date.now();if(l>0){b.textContent=fDur(l)}else if(!r.classList.contains('go')){r.classList.add('go');b.textContent='Jdi na to'}}}
/* ---------- events ---------- */
document.addEventListener('click',e=>{const el=e.target.closest&&e.target.closest('[data-a]');if(!el)return;const f=A[el.dataset.a];if(f)f(el.dataset,el)});
document.addEventListener('input',e=>{const t=e.target,d=t.dataset||{};
  if(d.in==='set'){const it=ctxItems()[+d.i];if(!it||!it.sets[+d.s])return;const v=parseFloat(String(t.value).replace(',','.'));it.sets[+d.s][d.k]=isFinite(v)&&v>=0?v:0;saveSoon()}
  else if(d.in==='libq'){ui.lib.q=t.value;const l=$('#liblist');if(l)l.innerHTML=libList()}
  else if(d.in==='pname'){const p=curPlan();if(p){p.name=t.value;saveSoon()}}});
document.addEventListener('focusin',e=>{if(e.target.classList&&e.target.classList.contains('num'))try{e.target.select()}catch(x){}});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){wake();tick()}else if(saveT)save()});

$('#file').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>doImport(String(r.result));r.readAsText(f);e.target.value=''});

})();
